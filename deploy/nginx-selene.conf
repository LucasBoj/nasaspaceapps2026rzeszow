# SELENE OPS — static Blazor WebAssembly site.
# Installed by server-setup.sh as /etc/nginx/sites-available/selene (included in the http {} context).
#
# Two sites from the same build:
#   stable  → /var/www/selene/stable   (port 80)   ← the ONLY link given to the jury
#   preview → /var/www/selene/preview  (port 8080) ← for testing a build before promoting it
# Both server blocks are intentionally identical except for listen/root.

# Cache policy by request path. Set via ONE add_header at server level: an add_header inside a
# location would silently drop every header inherited from the server (incl. the security headers).
map $uri $selene_cache_control {
    default                                                                  "no-cache";                              # index.html, appsettings.json, js/, css/ → revalidate (ETag)
    ~^/_framework/                                                           "public, max-age=31536000, immutable";   # every file here is fingerprinted
    "~*\.[a-z0-9]{10}\.(js|mjs|css|wasm|dat|blat|json|glb|png|svg|woff2?)$"  "public, max-age=31536000, immutable";   # other fingerprinted assets
    ~^/data/                                                                 "public, max-age=3600";
    ~^/models/                                                               "public, max-age=3600";
}

# ---------------------------------------------------------------- stable (jury link)
server {
    # If the Mikrus panel maps your subdomain to a different port, change BOTH listen lines.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/selene/stable;
    index index.html;

    # Compression: dotnet publish ships *.gz next to every asset (gzip_static); deploy.sh adds *.gz for .glb.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css application/wasm model/gltf-binary image/svg+xml;

    add_header Cache-Control $selene_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MIME types per extension. A `types {}` block at server level would REPLACE nginx's whole
    # default map, so each extension gets its own small location instead (no add_header here,
    # so the server-level headers above still apply).
    location ~* \.wasm$         { types { } default_type application/wasm;         try_files $uri =404; }
    location ~* \.(dat|blat)$   { types { } default_type application/octet-stream; try_files $uri =404; }
    location ~* \.glb$          { types { } default_type model/gltf-binary;        try_files $uri =404; }
    location ~* \.json$         { types { } default_type application/json;         try_files $uri =404; }

    # SPA: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------- preview (testing only)
server {
    # Preview for testing a build before `deploy.sh stable`. The link for the jury is ALWAYS the stable site.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/selene/preview;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css application/wasm model/gltf-binary image/svg+xml;

    add_header Cache-Control $selene_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.wasm$         { types { } default_type application/wasm;         try_files $uri =404; }
    location ~* \.(dat|blat)$   { types { } default_type application/octet-stream; try_files $uri =404; }
    location ~* \.glb$          { types { } default_type model/gltf-binary;        try_files $uri =404; }
    location ~* \.json$         { types { } default_type application/json;         try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
